    <!-- ── Structured Data: FAQPage ─────────────────────────────────── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is CAPortal?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "CAPortal is a practice management platform built for Indian Chartered Accountants. It replaces WhatsApp-based workflows with a professional client portal for document collection, ITR and GST deadline tracking, filing status, and UPI fee invoicing."
          }
        },
        {
          "@type": "Question",
          "name": "How much does CAPortal cost?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "CAPortal offers three plans: Starter at ₹799/month (up to 30 clients), Pro at ₹1,799/month (up to 100 clients), and Firm at ₹3,499/month (unlimited clients). All plans include a 14-day free trial with no credit card required."
          }
        },
        {
          "@type": "Question",
          "name": "Do my clients need to install an app?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Each client gets a private link. They open it in their phone browser, upload documents, check filing status, and pay fees — no app download or login needed."
          }
        },
        {
          "@type": "Question",
          "name": "Is CAPortal suitable for GST filing?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. CAPortal tracks all GST deadlines (GSTR-1, GSTR-3B, annual return) alongside ITR and TDS deadlines. The document checklist for GST clients is pre-configured with GST returns, invoices, and balance sheets."
          }
        }
      ]
    }
    </script>
